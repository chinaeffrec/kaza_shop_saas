# Kaza Shop — Nginx config without SSL (access by IP, admin use only)
# Used when certbot could not obtain a certificate.

# ── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=kaza_auth_ns:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=kaza_api_ns:20m    rate=60r/s;
limit_req_zone $binary_remote_addr zone=kaza_upload_ns:10m rate=3r/m;
limit_req_status 429;

# ── App upstream (2 instances, keepalive) ─────────────────────────────────────
upstream kaza_app_ns {
    least_conn;
    keepalive 32;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 32M;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Block internal monitoring endpoints ───────────────────────────────────
    location ~ ^/(metrics|docs|redoc|openapi\.json)$ {
        deny all;
        return 403;
    }

    # ── Static media (served directly by nginx) ───────────────────────────────
    location /media/ {
        alias /opt/kaza_shop/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        if ($request_uri ~* "\.\./") { return 403; }
    }

    # ── Platform auth: tight rate limit ──────────────────────────────────────
    location ~ ^/platform/auth/(login|refresh|logout|2fa) {
        client_max_body_size 4k;
        limit_req zone=kaza_auth_ns burst=10 nodelay;
        proxy_pass http://kaza_app_ns;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Media / product import ────────────────────────────────────────────────
    location ~ ^/api/v1/import {
        client_max_body_size 512M;
        limit_req zone=kaza_upload_ns burst=3 nodelay;
        proxy_pass http://kaza_app_ns;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Bot-only endpoints: deny external access ──────────────────────────────
    location ~ ^/api/v1/(cart|users/register)(/|$) { deny all; return 403; }
    location ~ ^/api/v1/orders/user/ { deny all; return 403; }

    # ── API v1 ────────────────────────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=kaza_api_ns burst=200 nodelay;
        proxy_pass http://kaza_app_ns;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Platform admin API ────────────────────────────────────────────────────
    location /platform/ {
        limit_req zone=kaza_api_ns burst=50 nodelay;
        proxy_pass http://kaza_app_ns;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://kaza_app_ns;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Seller panel (React SPA) ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/kaza_shop_access.log;
    error_log  /var/log/nginx/kaza_shop_error.log warn;
}
