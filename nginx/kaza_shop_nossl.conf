# Kaza Shop — Nginx конфиг без SSL (доступ по IP, только администратор)
# Rate limit не нужен — панель используется одним администратором

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Медиафайлы напрямую через nginx
    location /media/ {
        alias /opt/kaza_shop/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        if ($request_uri ~* "\.\./") { return 403; }
    }

    # Эндпоинты только для бота (доступ через Docker-сеть, не через nginx)
    location ~ ^/orders/user/  { deny all; }
    location ~ ^/cart/          { deny all; }
    location = /users/register  { deny all; }
    location = /orders/ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Загрузка медиафайлов - увеличенный лимит
    location = /settings/media-import {
        client_max_body_size 512M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API
    location ~ ^/(auth|orders|products|cart|catalog|import|settings|faq|stats|users|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Панель продавца (статика, собранная nginx)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    access_log /var/log/nginx/kaza_shop_access.log;
    error_log  /var/log/nginx/kaza_shop_error.log warn;
}
