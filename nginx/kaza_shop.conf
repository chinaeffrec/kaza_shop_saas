# Kaza Shop — Production nginx config (SSL)
# YOUR_DOMAIN is replaced by the installer with the real hostname.

# ── Rate limiting zones ──────────────────────────────────────────────────────
# Shared memory — survives nginx reload without losing counters.
# FIXED: was "30r/m" (30/minute) which blocked normal panel usage.
limit_req_zone $binary_remote_addr zone=kaza_auth:10m    rate=5r/m;    # login / 2FA — brute-force guard
limit_req_zone $binary_remote_addr zone=kaza_api:20m     rate=60r/s;   # general API
limit_req_zone $binary_remote_addr zone=kaza_upload:10m  rate=3r/m;    # media / product imports
limit_req_zone $binary_remote_addr zone=kaza_export:10m  rate=10r/m;   # stats exports (CPU-heavy)
limit_req_status 429;  # 429 Too Many Requests, not 503 Service Unavailable

# ── App upstream (2 instances, keepalive) ────────────────────────────────────
upstream kaza_app {
    least_conn;
    keepalive 32;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;
    server_tokens off;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers (defence-in-depth alongside app middleware) ──────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Upstream keepalive (required for reuse) ───────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Proxy timeouts ────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Default body limit (import endpoint overrides this to 512M below)
    client_max_body_size 32M;

    # ── Block internal monitoring and debug endpoints ─────────────────────────
    location ~ ^/(metrics|docs|redoc|openapi\.json)$ {
        deny all;
        return 403;
    }

    # ── Static media (served by nginx, bypasses Python/FastAPI) ──────────────
    # Files are content-addressed (UUID in name) — safe to cache for 1 year.
    location /media/ {
        alias /opt/kaza_shop/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        # Block path traversal attempts
        if ($request_uri ~* "\.\./") { return 403; }
    }

    # ── Platform auth: tightest rate limit (login / 2FA / refresh) ───────────
    # 5 req/min per IP with burst=10 — blocks brute force while allowing
    # brief burst from legitimate users (page reload, slow network retry).
    location ~ ^/platform/auth/(login|refresh|logout|2fa) {
        client_max_body_size 4k;
        limit_req zone=kaza_auth burst=10 nodelay;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Stats export (XLSX generation is CPU-heavy): tight limit ─────────────
    location ~ ^/api/v1/stats/export {
        limit_req zone=kaza_export burst=5 nodelay;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Media / product import (large ZIP archives): relaxed body limit ───────
    location ~ ^/api/v1/import {
        client_max_body_size 512M;
        limit_req zone=kaza_upload burst=3 nodelay;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Bot-only endpoints: deny external access ──────────────────────────────
    # The bot reaches these via the Docker internal network (app:8000).
    # External clients hitting these through nginx must be blocked.
    location ~ ^/api/v1/(cart|users/register)(/|$) { deny all; return 403; }
    location ~ ^/api/v1/orders/user/ { deny all; return 403; }

    # ── API v1 (seller panel + Telegram Mini App) ─────────────────────────────
    location /api/v1/ {
        limit_req zone=kaza_api burst=200 nodelay;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Platform admin API ────────────────────────────────────────────────────
    location /platform/ {
        limit_req zone=kaza_api burst=50 nodelay;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Health check (no rate limit — used by Docker and monitoring) ──────────
    location /health {
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Seller panel (React SPA) ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/kaza_shop_access.log;
    error_log  /var/log/nginx/kaza_shop_error.log warn;
}
