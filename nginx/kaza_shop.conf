# Kaza Shop - Nginx конфиг для продакшна
# YOUR_DOMAIN будет заменён на реальный домен установщиком

# Ограничение частоты запросов
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login_limit:1m rate=5r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL (certbot заполнит)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (дублируются с middleware - defence in depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Лимит загружаемых файлов
    client_max_body_size 25M;

    # Таймауты (защита при зависании БД)
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Медиафайлы напрямую через nginx (не через Python) ───────────────────
    location /media/ {
        alias /opt/kaza_shop/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # Защита от path traversal
        if ($request_uri ~* "\.\./") { return 403; }
    }

    # ── Rate limit на login ───────────────────────────────────────────────────
    location /auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Загрузка медиафайлов - увеличенный лимит ─────────────────────────────
    location = /settings/media-import {
        client_max_body_size 512M;
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Эндпоинты только для внутренней сети (бот → app напрямую) ──────────────
    # Бот обращается к app:8000 через Docker-сеть, минуя nginx.
    # Браузеру (админке) эти пути недоступны.
    location ~ ^/orders/user/  { deny all; }
    location ~ ^/cart/          { deny all; }
    location = /users/register  { deny all; }
    # POST /orders/ - только бот; GET /orders/ и /orders/{id}/* - нужны админке
    location = /orders/ {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    location ~ ^/(auth|orders|products|cart|catalog|import|settings|faq|stats|users|health)(/|$) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Seller panel (статика, собранная nginx) ──────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Логи
    access_log /var/log/nginx/kaza_shop_access.log;
    error_log  /var/log/nginx/kaza_shop_error.log warn;
}
