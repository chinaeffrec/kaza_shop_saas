server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    location /miniapp/ {
        try_files $uri $uri/ /miniapp/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
