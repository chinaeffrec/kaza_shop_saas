###############################################################################
# Kaza Shop — High Availability stack
#
# Topology:
#   PostgreSQL:  primary (write) + replica (read/standby) via streaming replication
#   PgBouncer:   connection pooler in front of primary (transaction mode)
#   Redis:       master + replica + 3 Sentinel nodes (automatic failover)
#   App:         2 replicas behind Nginx upstream load balancer
#   Storage:     MinIO (S3-compatible, used for WAL archiving / media backups)
#   Observability: Prometheus + Grafana
#
# Usage:
#   docker compose -f docker-compose.ha.yml up -d
#
# Required .env variables (subset):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD,
#   SECRET_KEY, BOT_TOKEN, ...  (full list in .env.example)
###############################################################################

version: "3.9"

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://kaza:${POSTGRES_PASSWORD}@pgbouncer:5432/kazadb
  DB_PGBOUNCER_URL: postgresql+asyncpg://kaza:${POSTGRES_PASSWORD}@pgbouncer:5432/kazadb
  DB_REPLICA_HOST: pg-replica
  DB_REPLICA_PORT: 5432
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379/0
  REDIS_SENTINEL_HOSTS: "sentinel1:26379,sentinel2:26379,sentinel3:26379"
  REDIS_SENTINEL_MASTER: mymaster
  REDIS_SENTINEL_PASSWORD: ${REDIS_PASSWORD}
  SECRET_KEY: ${SECRET_KEY}
  BOT_TOKEN: ${BOT_TOKEN}
  DOMAIN: ${DOMAIN:-localhost}
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  PROMETHEUS_ENABLED: "true"

networks:
  kaza-net:
    driver: bridge

volumes:
  pg-primary-data:
  pg-replica-data:
  redis-master-data:
  redis-replica-data:
  minio-data:
  prometheus-data:
  grafana-data:

services:

  # ── PostgreSQL primary ────────────────────────────────────────────────────
  pg-primary:
    image: postgres:16-alpine
    container_name: pg-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kazadb
      # Enable WAL archiving to MinIO via wal-g (optional; needs wal-g binary)
      POSTGRES_INITDB_ARGS: "--wal-segsize=64"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - wal_keep_size=256MB
      - -c
      - hot_standby=on
      - -c
      - archive_mode=off
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaza -d kazadb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaza-net

  # ── PostgreSQL replica ────────────────────────────────────────────────────
  pg-replica:
    image: postgres:16-alpine
    container_name: pg-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kazadb
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: pg-primary
      PRIMARY_USER: kaza
      PRIMARY_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaza -d kazadb"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kaza-net

  # ── PgBouncer ─────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: kaza
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: pg-primary
      DB_NAME: kazadb
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "5432:5432"
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U kaza"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaza-net

  # ── Redis master ──────────────────────────────────────────────────────────
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaza-net

  # ── Redis replica ─────────────────────────────────────────────────────────
  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --replicaof redis-master 6379
      --masterauth ${REDIS_PASSWORD}
      --replica-read-only yes
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaza-net

  # ── Redis Sentinel ×3 ─────────────────────────────────────────────────────
  sentinel1:
    image: redis:7-alpine
    container_name: sentinel1
    restart: unless-stopped
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - kaza-net

  sentinel2:
    image: redis:7-alpine
    container_name: sentinel2
    restart: unless-stopped
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - kaza-net

  sentinel3:
    image: redis:7-alpine
    container_name: sentinel3
    restart: unless-stopped
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - kaza-net

  # ── MinIO (S3-compatible WAL archiving / media backups) ───────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kaza-net

  # ── Application — replica 1 ───────────────────────────────────────────────
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app1
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - /app/media:/app/media
      - /app/logs:/app/logs
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kaza-net

  # ── Application — replica 2 ───────────────────────────────────────────────
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app2
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - /app/media:/app/media
      - /app/logs:/app/logs
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kaza-net

  # ── Nginx upstream load balancer ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-ha
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.ha.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /app/media:/app/media:ro
    depends_on:
      - app1
      - app2
    networks:
      - kaza-net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - kaza-net

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - kaza-net
