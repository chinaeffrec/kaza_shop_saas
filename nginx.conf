events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 32M;

    upstream api {
        server app:8000;
    }

    upstream panel {
        server seller:80;
    }

    upstream miniapp {
        server miniapp:80;
    }

    server {
        listen 80;

        # Mini App (Telegram WebApp) — /miniapp/* → miniapp-контейнер
        location /miniapp/ {
            proxy_pass http://miniapp/miniapp/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # Все API-эндпоинты → бэкенд
        location ~* ^/(api|auth|products|cart|orders|stats|catalog|settings|users|imports|health|docs|redoc|openapi\.json|media)(/.*)?$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Всё остальное → панель продавца
        location / {
            proxy_pass http://panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }
    }
}
