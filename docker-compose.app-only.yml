# ==============================================================================
#  Kaza Shop — APP-ONLY compose (топология «два сервера»)
#
#  Запускается на APP-сервере (может быть за рубежом).
#  PostgreSQL и Redis находятся на DATA-сервере — задаются через .env:
#    DATABASE_URL=postgresql+asyncpg://kaza_user:PASS@DATA_IP:5432/kaza_shop
#    REDIS_URL=redis://:REDIS_PASS@DATA_IP:6379/0
#
#  Использование:
#    docker compose -f docker-compose.app-only.yml up -d --build
# ==============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    environment:
      ENV: production
      # DB и Redis — внешние (на DATA-сервере), depends_on не нужен
      KAZA_TOPOLOGY: app-only
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - external
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    command: python -m app.bot.bot
    env_file: .env
    environment:
      ENV: production
      KAZA_TOPOLOGY: app-only
    depends_on:
      app:
        condition: service_healthy
    networks:
      - external
    deploy:
      resources:
        limits:
          memory: 256M

  seller:
    build:
      context: ./seller-panel
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - external
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  external:
    driver: bridge
