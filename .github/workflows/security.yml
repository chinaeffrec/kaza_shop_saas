name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 03:00 UTC
    - cron: "0 3 * * 1"

# Suppress Node.js 20 deprecation warnings from GitHub Actions runners
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  python-security:
    name: Python — Bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      # Bandit exit codes:
      #   0 — no issues found
      #   1 — issues found (any severity matching the filter)
      #   2 — internal error (parse failure, bad flag, etc.)
      # We capture the exit code and only fail if HIGH-severity issues exist,
      # so MEDIUM findings are reported but don't block CI.
      - name: Bandit SAST
        id: bandit
        run: |
          set +e
          bandit \
            -r app/ \
            -x app/tests/ \
            --confidence-level MEDIUM \
            --severity-level MEDIUM \
            --format json \
            -o bandit-report.json 2>&1
          BANDIT_RC=$?
          set -e
          echo "exit_code=${BANDIT_RC}" >> "$GITHUB_OUTPUT"
          # Exit code 2 = bandit crashed (bad config, missing files, etc.)
          if [ "$BANDIT_RC" -eq 2 ]; then
            echo "::error::Bandit encountered an internal error (exit code 2)"
            exit 2
          fi
          # Exit code 0 or 1 → inspect the JSON for HIGH findings
          exit 0

      - name: Check Bandit results
        if: always() && steps.bandit.outputs.exit_code != '2'
        run: |
          if [ ! -f bandit-report.json ]; then
            echo "::warning::bandit-report.json not produced — no Python sources found?"
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          with open("bandit-report.json") as f:
              data = json.load(f)
          results = data.get("results", [])
          high   = [r for r in results if r["issue_severity"] == "HIGH"]
          medium = [r for r in results if r["issue_severity"] == "MEDIUM"]
          print(f"Bandit: {len(high)} HIGH, {len(medium)} MEDIUM findings")
          for r in high[:10]:
              fn   = r["filename"]
              line = r["line_number"]
              msg  = r["issue_text"]
              print(f"::error file={fn},line={line}::HIGH: {msg}")
          for r in medium[:5]:
              fn   = r["filename"]
              line = r["line_number"]
              msg  = r["issue_text"]
              print(f"::warning file={fn},line={line}::MEDIUM: {msg}")
          if high:
              print(f"\nCI fails on {len(high)} HIGH-severity finding(s).")
              sys.exit(1)
          PY

      # pip-audit: report CVEs as warnings; don't block CI
      # (pinned ranges may lag behind fixes — review manually)
      - name: pip-audit CVE scan
        run: |
          set +e
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --no-deps
          PIP_RC=$?
          set -e
          if [ ! -f pip-audit-report.json ]; then
            echo "::warning::pip-audit-report.json not produced"
            exit 0
          fi
          python3 - <<'PY'
          import json
          with open("pip-audit-report.json") as f:
              data = json.load(f)
          vulns = [v for pkg in data.get("dependencies", [])
                     for v in pkg.get("vulns", [])]
          if vulns:
              print(f"::warning::pip-audit: {len(vulns)} known CVE(s) — review pip-audit-report.json")
              for v in vulns[:10]:
                  vid = v.get("id", "?")
                  fix = v.get("fix_versions", [])
                  desc = v.get("description", "")[:100]
                  print(f"  {vid} (fix: {fix}): {desc}")
          else:
              print("pip-audit: no known vulnerabilities ✓")
          PY

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          # Don't fail the workflow if the files weren't created (e.g. Bandit crashed)
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  frontend-security:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: seller-panel/package-lock.json

      # Install without running postinstall scripts (safer in CI)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fail CI only on HIGH or CRITICAL vulnerabilities.
      # MODERATE findings are reported as warnings.
      - name: npm audit (high+ severity)
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json 2>&1
          NPM_RC=$?
          set -e
          # Summarise findings in human-readable form regardless of exit code
          node - <<'JS'
          const fs = require('fs');
          try {
            const data = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
            const meta = data.metadata || {};
            const vulns = meta.vulnerabilities || {};
            const total = Object.values(vulns).reduce((a, b) => a + b, 0);
            if (total === 0) {
              console.log('npm audit: no vulnerabilities ✓');
            } else {
              console.log(`npm audit: ${JSON.stringify(vulns)}`);
              if ((vulns.critical || 0) + (vulns.high || 0) > 0) {
                console.log('::error::High/critical npm vulnerabilities found — review npm-audit-report.json');
              } else {
                console.log('::warning::Moderate/low npm vulnerabilities found');
              }
            }
          } catch (e) {
            console.log('::warning::Could not parse npm audit output:', e.message);
          }
          JS
          # Propagate non-zero exit only for actual HIGH/CRITICAL (npm exits 1)
          exit $NPM_RC

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: seller-panel/npm-audit-report.json
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: TruffleHog secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed for git-log based scanning
          fetch-depth: 0

      # For push events: scan commits between the previous HEAD and the new HEAD.
      # For pull_request events: scan commits added by the PR.
      # For schedule / workflow_dispatch: fall back to scanning the whole filesystem
      # (no meaningful git range available).
      #
      # The "BASE and HEAD commits are the same" error happens when:
      #   a) first push to a brand-new branch (before = 0000...0000)
      #   b) base/head are both set to the same ref (our original bug)
      # Fix: use github.event.before (actual previous SHA) and github.sha (new SHA).
      # On a brand-new branch github.event.before is all zeros → TruffleHog will
      # scan from the repo root in filesystem mode (continue-on-error handles edge cases).
      - name: TruffleHog — git diff scan (push / PR)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
        continue-on-error: true
        # continue-on-error: TruffleHog exits 183 when verified secrets are found;
        # it also exits 1 on config errors. We capture findings in logs and let the
        # step annotation surface them without hard-failing on scan infrastructure issues.

      - name: TruffleHog — filesystem scan (scheduled / manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: true
