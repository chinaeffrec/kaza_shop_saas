[databases]
; Route all connections to the primary PostgreSQL instance
kazadb = host=pg-primary port=5432 dbname=kazadb

[pgbouncer]
;;;
;;; Pooling mode: transaction — best for async SQLAlchemy + asyncpg
;;; WARNING: prepared statements and SET session variables don't survive
;;;          across connections in transaction mode. SQLAlchemy's
;;;          pool_pre_ping=False is required when behind PgBouncer.
;;;
pool_mode = transaction

;;; Connection limits
listen_port = 5432
listen_addr = 0.0.0.0
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

;;; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;;; TLS (disabled inside the Docker private network)
; server_tls_sslmode = prefer

;;; Timeouts
server_idle_timeout = 600
client_idle_timeout = 0
server_connect_timeout = 15
query_timeout = 0
