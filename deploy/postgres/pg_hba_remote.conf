# pg_hba.conf для DATA-ONLY топологии
# Разрешает подключения с любого IP (фильтрация осуществляется firewall'ом ufw)
# В production firewall ограничивает :5432 только до IP APP-сервера

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Удалённые подключения — аутентификация по паролю (APP-сервер)
host    all             all             0.0.0.0/0               scram-sha-256
