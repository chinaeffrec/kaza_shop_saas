# PostgreSQL Client Authentication Configuration
# TYPE  DATABASE  USER  ADDRESS         METHOD

# Local connections (within the container)
local   all       all                   trust

# IPv4 loopback
host    all       all   127.0.0.1/32    scram-sha-256

# IPv6 loopback
host    all       all   ::1/128         scram-sha-256

# Docker bridge network — allow app containers and PgBouncer
host    all       all   172.16.0.0/12   scram-sha-256

# Replication slot — allow replica container (same network range)
host    replication  all  172.16.0.0/12  scram-sha-256
