# Redis Sentinel configuration
# All three sentinel containers mount this same file.
#
# Sentinel monitors redis-master. If the master is unreachable for
# more than `down-after-milliseconds`, and `quorum` sentinels agree,
# it triggers an automatic failover.

port 26379
bind 0.0.0.0

# Monitor the master.
# Syntax: sentinel monitor <master-name> <host> <port> <quorum>
# quorum=2 — majority of 3 sentinels must agree to trigger failover.
sentinel monitor mymaster redis-master 6379 2

# Password for the master AND replica (both must use the same password).
# Uses the REDIS_PASSWORD env var at startup via shell expansion — NOT
# supported natively in sentinel.conf, so we template it via entrypoint.
# For Docker Compose the password is injected via command override.
# Replace ${REDIS_PASSWORD} with the actual password at deploy time,
# OR use the companion sentinel-entrypoint.sh helper.
sentinel auth-pass mymaster CHANGEME_REDIS_PASSWORD

# After this many ms without PONG, the master is considered down.
sentinel down-after-milliseconds mymaster 5000

# How many replicas can be reconfigured in parallel during failover.
sentinel parallel-syncs mymaster 1

# If failover takes longer than this, try again.
sentinel failover-timeout mymaster 30000

# Sentinel itself is protected by the same password (requirepass).
requirepass CHANGEME_REDIS_PASSWORD
