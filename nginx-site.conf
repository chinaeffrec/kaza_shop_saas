# ── App upstream — least_conn with passive health checks ─────────────────────
# Add/remove servers here when scaling app instances.
# keepalive 32 — reuse connections to upstream (avoids TCP handshake per request).
# max_fails / fail_timeout — passive health check: remove server after 3 failures
# within 30 s; retry after 30 s.
upstream kaza_app {
    least_conn;
    keepalive 32;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32M;

    # Required for upstream keepalive reuse (HTTP/1.1 persistent connections)
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Gzip compression ─────────────────────────────────────────────────────
    # Reduces JSON API response size by ~70-80%, directly improving throughput.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Block internal monitoring endpoints from external access ─────────────
    # /metrics (Prometheus) must only be scraped from inside the Docker network.
    # /docs, /redoc, /openapi.json are disabled in production by FastAPI itself,
    # but we block at nginx as defence-in-depth.
    location ~ ^/(metrics|docs|redoc|openapi\.json)$ {
        deny all;
        return 403;
    }

    # ── Auth endpoints — tight body limit (JSON only, no file uploads) ───────
    # Prevents large-body DoS on login/2FA/refresh endpoints.
    location ~ ^/platform/auth/(login|refresh|logout|2fa/) {
        client_max_body_size 4k;
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── API v1 (tenant + bot routes) ─────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Platform routes (admin API) ──────────────────────────────────────────
    location /platform/ {
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Static media files ───────────────────────────────────────────────────
    # Files are content-addressed (UUID in filename) — safe to cache forever.
    # immutable tells browsers not to revalidate within max-age (saves RTTs).
    location /media/ {
        proxy_pass http://kaza_app;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        gzip_static on;
    }

    # ── Seller panel (React SPA) ─────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
